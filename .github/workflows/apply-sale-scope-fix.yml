name: Apply sale inventory scope fix

on:
  push:
    branches:
      - fix/sale-inventory-scope

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'MrDan001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sale-inventory-scope
          fetch-depth: 0

      - name: Apply exact security patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('apps/frontend/lib/business.actions.ts')
          s = p.read_text()

          old_owner = "const saleOwnerId = session.role === 'owner' ? session.id : session.ownerId!;\n"
          new_owner = old_owner + "  const saleStoreId = await getActiveStoreId();\n"
          if s.count(old_owner) != 1:
              raise SystemExit(f'Expected exactly 1 saleOwnerId declaration, found {s.count(old_owner)}')
          s = s.replace(old_owner, new_owner, 1)

          old_price = '''const priceLookupRows = await prisma.inventory.findMany({\n    where: { id: { in: cartItems.map((i) => i.id) } },\n  });'''
          new_price = '''const priceLookupRows = await prisma.inventory.findMany({\n    where: {\n      id: { in: cartItems.map((i) => i.id) },\n      ownerId: saleOwnerId,\n      storeId: saleStoreId,\n    },\n  });'''
          if s.count(old_price) != 1:
              raise SystemExit(f'Expected exactly 1 price lookup, found {s.count(old_price)}')
          s = s.replace(old_price, new_price, 1)

          old_tx = '''const inventoryRows = await tx.inventory.findMany({ where: { id: { in: cartItems.map((i) => i.id) } } });'''
          new_tx = '''const inventoryRows = await tx.inventory.findMany({\n      where: {\n        id: { in: cartItems.map((i) => i.id) },\n        ownerId: saleOwnerId,\n        storeId: saleStoreId,\n      },\n    });'''
          if s.count(old_tx) != 1:
              raise SystemExit(f'Expected exactly 1 transaction inventory lookup, found {s.count(old_tx)}')
          s = s.replace(old_tx, new_tx, 1)

          old_late = "  const saleStoreId = await getActiveStoreId();\n  // A part payment always needs"
          if s.count(old_late) != 1:
              raise SystemExit(f'Expected exactly 1 late saleStoreId declaration, found {s.count(old_late)}')
          s = s.replace(old_late, "  // A part payment always needs", 1)

          p.write_text(s)
          PY

      - name: Verify exact diff
        run: |
          git diff --check
          git diff -- apps/frontend/lib/business.actions.ts
          git diff --numstat -- apps/frontend/lib/business.actions.ts

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/frontend/lib/business.actions.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: scope sale inventory to owner and store'
          git push origin HEAD:fix/sale-inventory-scope
