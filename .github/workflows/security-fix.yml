name: Security Fix Validation

on:
  push:
    branches:
      - fix/sale-inventory-scope
  pull_request:
    branches:
      - main
      - fix/sale-inventory-scope

permissions:
  contents: read

concurrency:
  group: security-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate security fix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: git diff --check

      - name: Type check
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
