name: Security Fix Validation

on:
  push:
    branches:
      - fix/sale-inventory-scope
  pull_request:
    branches:
      - main
      - fix/sale-inventory-scope

permissions:
  contents: read

concurrency:
  group: security-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate security fix
    runs-on: ubuntu-latest

    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # The branch's lockfile predates the ESLint 9/Next 16 toolchain update.
      # Refresh it in CI before installation so npm ci receives a consistent lock.
      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
